<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust+ Control Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --hint-color: var(--tg-theme-hint-color, #94a3b8);
            --button-color: var(--tg-theme-button-color, #6366f1);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .container {
            max-width: 480px;
            margin: auto;
            padding-bottom: 30px;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--hint-color);
            margin-bottom: 16px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            font-size: 15px;
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        label {
            font-size: 12px;
            color: var(--hint-color);
            display: block;
            margin-bottom: 4px;
            margin-top: 8px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--button-color);
        }

        .row {
            display: flex;
            gap: 8px;
        }

        .row > div {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 10px;
            border: none;
            background-color: var(--button-color);
            color: var(--button-text);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-danger {
            background-color: #ef4444;
        }

        .btn-success {
            background-color: #22c55e;
        }

        .output-box {
            background: #020617;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            max-height: 180px;
            overflow-y: auto;
            margin-top: 10px;
            color: #38bdf8;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            float: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🛡️ Rust+ Control Panel <span class="badge">PRO</span></h2>
        <div class="subtitle">Управление сервером и устройствами из Telegram</div>

        <!-- Блок авторизации / данных сервера -->
        <div class="card">
            <h3>🔑 Авторизация Rust+</h3>
            
            <div class="row">
                <div>
                    <label>IP Сервера</label>
                    <input type="text" id="ip" placeholder="192.168.1.1">
                </div>
                <div>
                    <label>App Порт</label>
                    <input type="number" id="port" placeholder="28082">
                </div>
            </div>

            <label>SteamID (Player ID)</label>
            <input type="text" id="playerId" placeholder="76561198xxxxxxxx">

            <label>Player Token (Сопряжение)</label>
            <input type="number" id="playerToken" placeholder="12345678 или -1234567">
            
            <button onclick="saveCreds()" style="background: rgba(255,255,255,0.1); margin-top: 12px;">💾 Сохранить данные в памяти</button>
        </div>

        <!-- Блок информации -->
        <div class="card">
            <h3>📊 Информация</h3>
            <div class="row">
                <button onclick="getServerInfo()">Статус</button>
                <button onclick="getServerTime()">Время</button>
            </div>
        </div>

        <!-- Блок управления устройствами -->
        <div class="card">
            <h3>💡 Умный свет / Реле</h3>
            <label>ID Элемента (Entity ID)</label>
            <input type="text" id="entityId" placeholder="Например: 123456">
            
            <div class="row">
                <button class="btn-success" onclick="switchDevice(true)">Включить</button>
                <button class="btn-danger" onclick="switchDevice(false)">Выключить</button>
            </div>
        </div>

        <!-- Консоль ответа -->
        <div class="card" style="margin-bottom: 0;">
            <h3>🖥️ Лог ответа</h3>
            <div id="output" class="output-box">Ожидание действий...</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Автозагрузка сохраненных данных при открытии
        window.onload = () => {
            if(localStorage.getItem('rust_ip')) document.getElementById('ip').value = localStorage.getItem('rust_ip');
            if(localStorage.getItem('rust_port')) document.getElementById('port').value = localStorage.getItem('rust_port');
            if(localStorage.getItem('rust_playerId')) document.getElementById('playerId').value = localStorage.getItem('rust_playerId');
            if(localStorage.getItem('rust_token')) document.getElementById('playerToken').value = localStorage.getItem('rust_token');
        }

        function saveCreds() {
            localStorage.setItem('rust_ip', document.getElementById('ip').value);
            localStorage.setItem('rust_port', document.getElementById('port').value);
            localStorage.setItem('rust_playerId', document.getElementById('playerId').value);
            localStorage.setItem('rust_token', document.getElementById('playerToken').value);
            setOut("✅ Данные успешно сохранены в памяти телефона!");
        }

        function getCreds() {
            return {
                ip: document.getElementById('ip').value,
                port: document.getElementById('port').value,
                playerId: document.getElementById('playerId').value,
                playerToken: document.getElementById('playerToken').value
            };
        }

        async function sendApi(endpoint, bodyData) {
            setOut("⏳ Запрос отправлен на сервер...");
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });
                const json = await res.json();
                setOut(JSON.stringify(json, null, 2));
            } catch (err) {
                setOut("❌ Ошибка соединения с бэкендом Railway: " + err.message);
            }
        }

        function getServerInfo() {
            sendApi('/api/info', getCreds());
        }

        function getServerTime() {
            sendApi('/api/time', getCreds());
        }

        function switchDevice(turnOn) {
            const data = {
                ...getCreds(),
                entityId: document.getElementById('entityId').value,
                turnOn
            };
            sendApi('/api/device', data);
        }

        function setOut(text) {
            document.getElementById('output').innerText = text;
        }
    </script>
</body>
</html>
